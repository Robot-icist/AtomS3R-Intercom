; =============================================================================
;  AtomS3R Intercom base station
;  Hardware: M5Stack AtomS3R + Atomic Voice Base (K147)
;
;  The StickS3-Intercom project must be built and flashed separately. Both
;  projects share the IntercomShared library one directory up.
; =============================================================================

[platformio]
default_envs = atoms3r_intercom
src_dir = src

[env:atoms3r_intercom]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 1500000

; ESP32-S3-PICO-1-N8R8: 8 MB QIO flash + 8 MB OPI PSRAM
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv

; Pick up the shared library from the project-local submodule.
lib_extra_dirs = lib
lib_deps =
    m5stack/M5Unified@0.2.28

; M5Unified's speaker task stack is too small for this board's codec ISR
; (spk_task stack-canary panic). The patch script raises it before compiling.
extra_scripts = pre:lib/IntercomShared/tools/patch_m5unified.py

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DINTERCOM_BOARD_ATOMS3R
    -DINTERCOM_DEVICE_NAME=\"ATOM\"
    -DINTERCOM_CHANNEL=1
    -DCORE_DEBUG_LEVEL=0
